name: Poll watchlist history

on:
  schedule:
    - cron: "0 10 * * *"  # 6:00 AM ET daily — history gains one point per day
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  poll-history:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install poller deps
        run: pip install -r poller/requirements.txt

      - name: Poll market data
        run: python poller/market_poll.py --out docs/feed/latest.json --watchlist-out docs/feed/watchlist.json

      - name: Poll watchlist history
        run: python poller/history_poll.py --history-dir docs/feed/history

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
