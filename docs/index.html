<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<meta name="description" content="Glanceable market overview for Meta Ray-Ban Display glasses">
<meta name="mrbd-web-app-capable" content="yes">
<title>Markets</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <section class="view active" id="view-home">
    <header>
      <div class="title">MARKETS</div>
      <div class="synced" id="synced">connecting…</div>
    </header>
    <main id="grid"></main>
    <footer>
      <button id="to-list" data-focusable>Watchlist</button>
      <button id="refresh" data-focusable>Refresh</button>
    </footer>
  </section>

  <section class="view" id="view-list">
    <header>
      <div class="title">WATCHLIST</div>
      <div class="synced" id="synced-wl">connecting…</div>
    </header>
    <main id="wl-wrap"><div id="wl-list"></div></main>
    <footer>
      <button id="to-home" data-focusable>Markets</button>
      <button id="refresh2" data-focusable>Refresh</button>
    </footer>
  </section>

  <section class="view" id="view-detail">
    <header>
      <div class="title" id="d-sym">–</div>
      <div class="synced" id="d-asof"></div>
    </header>
    <main id="detail">
      <div class="d-name" id="d-name"></div>
      <div class="d-price" id="d-price">–</div>
      <div class="d-change" id="d-change"></div>
      <div class="d-chart" id="d-chart"></div>
      <div class="d-range">30-day daily closes</div>
    </main>
    <footer>
      <button id="to-back" data-focusable>← Back</button>
    </footer>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
